name: Application Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:

  security:

    runs-on: ubuntu-latest

    steps:

    ########################################################
    # Checkout
    ########################################################

    - name: Checkout Repository
      uses: actions/checkout@v4

    ########################################################
    # Python
    ########################################################

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    ########################################################
    # Install Security Tools
    ########################################################

    - name: Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit checkov pip-audit

    ########################################################
    # Create Reports Folder
    ########################################################

    - name: Create Reports Directory
      run: mkdir -p reports

    ########################################################
    # Bandit SAST
    ########################################################

    - name: Run Bandit
      run: |
        bandit -r . \
        -f sarif \
        -o reports/bandit.sarif || true

    ########################################################
    # Checkov Terraform Scan
    ########################################################

    - name: Run Checkov
      run: |
        checkov \
        -d . \
        -o sarif \
        > reports/checkov.sarif || true

    ########################################################
    # Dependency Scan
    ########################################################

    - name: Run pip-audit
      run: |
        pip-audit \
        -f json \
        -o reports/pip-audit.json || true

    ########################################################
    # GitLeaks Secret Scan
    ########################################################

    - name: Run GitLeaks
      uses: gitleaks/gitleaks-action@v2

    ########################################################
    # Trivy Filesystem Scan
    ########################################################

    - name: Trivy Filesystem Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: reports/trivy-fs.sarif

    ########################################################
    # Trivy Image Scan
    ########################################################

    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: alpine:latest
        format: table

    ########################################################
    # Upload Bandit SARIF
    ########################################################

    - name: Upload Bandit SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: reports/bandit.sarif

    ########################################################
    # Upload Checkov SARIF
    ########################################################

    - name: Upload Checkov SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: reports/checkov.sarif

    ########################################################
    # Upload Trivy SARIF
    ########################################################

    - name: Upload Trivy SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: reports/trivy-fs.sarif

    ########################################################
    # Upload Reports
    ########################################################

    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: reports/

    ########################################################
    # Success
    ########################################################

    - name: Security Scan Completed
      run: |
        echo "========================================="
        echo "Application Security Scan Completed"
        echo "Bandit"
        echo "Checkov"
        echo "GitLeaks"
        echo "Trivy"
        echo "pip-audit"
        echo "Reports uploaded"
        echo "========================================="