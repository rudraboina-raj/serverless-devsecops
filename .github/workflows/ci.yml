name: TechMart Enterprise CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: serverless-repo

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      ##################################################
      # Checkout
      ##################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ##################################################
      # Authenticate to Google Cloud
      ##################################################

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      ##################################################
      # Docker
      ##################################################

      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      ##################################################
      # Python
      ##################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pytest

      ##################################################
      # Code Quality
      ##################################################

      - name: Black Formatting Check
        run: black --check .

      - name: Flake8 Lint
        run: flake8 .

      - name: Run Tests
        run: pytest || true

      ##################################################
      # Employee Service
      ##################################################

      - name: Build Employee Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/employee-service:latest
          build-args: |
            SERVICE_NAME=employee_service

      ##################################################
      # Product Service
      ##################################################

      - name: Build Product Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/product-service:latest
          build-args: |
            SERVICE_NAME=product_service

      ##################################################
      # Order Service
      ##################################################

      - name: Build Order Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/order-service:latest
          build-args: |
            SERVICE_NAME=order_service

      ##################################################
      # Payment Service
      ##################################################

      - name: Build Payment Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/payment-service:latest
          build-args: |
            SERVICE_NAME=payment_service

      ##################################################
      # Notification Service
      ##################################################

      - name: Build Notification Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/notification-service:latest
          build-args: |
            SERVICE_NAME=notification_service

      ##################################################
      # Success
      ##################################################

      - name: Success
        run: |
          echo "======================================="
          echo "All TechMart services built successfully"
          echo "Employee Service"
          echo "Product Service"
          echo "Order Service"
          echo "Payment Service"
          echo "Notification Service"
          echo "Images pushed to Artifact Registry"
          echo "======================================="