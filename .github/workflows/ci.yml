name: TechMart CI Pipeline

on:

  push:

    branches:
      - main

  pull_request:

    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirement.txt
          pip install black
          pip install flake8
          pip install pytest

      - name: Check Formatting
        run: |
          black --check .

      - name: Lint Code
        run: |
          flake8 .

      - name: Build Employee Service Docker Image
        run: |
          docker build \
            --build-arg SERVICE_NAME=employee_service \
            -t employee-service:latest .